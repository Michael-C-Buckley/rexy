[package]
name = "rex-lite"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "A minimal native client for Rex, powered by libghostty"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
flume = "0.11"
futures-util = { version = "0.3", features = ["sink"] }
ghostty-vt = "=0.8.0"
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "net", "time", "sync", "io-util"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
url = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 2

