[package]
name = "rexy"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "A minimal native client for Rex, powered by libghostty"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.23"
# system_fonts finds a font on this machine for what the bundled ones cannot draw.
eframe = { version = "0.37.0", default-features = false, features = ["clipboard", "default_fonts", "glow", "system_fonts", "wayland", "x11"] }
flume = "0.12"
futures-util = { version = "0.3", features = ["sink"] }
# Ghostty's terminal. No release can restore a snapshot yet, so a commit is named.
# Its png feature decodes the pictures programs send as PNG, with a crate already here.
libghostty-vt = { git = "https://github.com/Uzaaft/libghostty-rs", rev = "483ea3d5247b214060da58ef6037a95f30ae89fb", features = ["png"] }
libc = "0.2"
# Already here through url. Rex writes a socket's path percent-encoded.
percent-encoding = "2"
# The window's own display and surface, for the three below.
raw-window-handle = "0.6"
# Draws the program icons.
resvg = { version = "0.50", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "net", "time", "sync", "io-util", "process"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
url = "2"
# Wayland lets a window come to the front only by asking in its own words. These are
# the releases the window is built on already.
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
# Speaks to the desktop's notification service.
zbus = { version = "6.3", default-features = false, features = ["tokio"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# The crates this one is built on are built to run fast, and without what a
# debugger would want of them, which is most of what a debug build takes on disk.
[profile.dev.package."*"]
opt-level = 2
debug = false

